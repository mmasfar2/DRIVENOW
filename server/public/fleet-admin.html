<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Management — DriveNow Portal</title>
<link rel="stylesheet" href="css/admin.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="admin-layout">
<div id="sidebar-root"></div>
<div class="main-content">
<div class="page">
  <div class="page-title">Fleet Management</div>
  <div class="page-sub">Vehicles available for assignment to approved applicants.</div>

  <div class="panel">
    <div class="panel-title">Add Vehicle</div>
    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:end;">
      <div class="field" style="margin-bottom:0;"><label>Make</label><input id="new-make" placeholder="Honda"></div>
      <div class="field" style="margin-bottom:0;"><label>Model</label><input id="new-model" placeholder="Accord LX"></div>
      <div class="field" style="margin-bottom:0;"><label>Year</label><input id="new-year" type="number" placeholder="2015"></div>
      <div class="field" style="margin-bottom:0;"><label>Weekly Rate ($)</label><input id="new-rate" type="number" placeholder="380"></div>
      <button class="btn" style="height:46px;" onclick="addVehicle()">Add</button>
    </div>
  </div>

  <div class="panel" style="padding:0;overflow-x:auto;">
    <table>
      <thead>
        <tr><th>Photo</th><th>Vehicle</th><th>Weekly Rate</th><th>Status</th><th>Notes</th><th></th></tr>
      </thead>
      <tbody id="fleet-table-body"></tbody>
    </table>
  </div>
  <p style="font-size:0.78rem;color:#888;margin-top:10px;">Photos uploaded here appear on the public website's Fleet page.</p>
</div>
</div>
</div>

<script src="js/admin-common.js"></script>
<script>
let vehicles = [];

async function load() {
  vehicles = await api('/api/vehicles');
  render();
}

function render() {
  document.getElementById('fleet-table-body').innerHTML = vehicles.length ? vehicles.map(v => `
    <tr>
      <td>
        <div style="display:flex;flex-wrap:wrap;gap:4px;max-width:160px;${(v.photos || []).length ? 'margin-bottom:6px;' : ''}">
          ${(v.photos || []).map(p => `
            <div style="position:relative;">
              <img src="/uploads/${p.photo_path}" alt="" style="width:48px;height:36px;object-fit:cover;border-radius:4px;background:#eee;">
              <button onclick="removePhoto(${v.id}, ${p.id})" title="Remove photo"
                style="position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:none;background:#c62828;color:#fff;font-size:10px;line-height:16px;cursor:pointer;padding:0;">×</button>
            </div>
          `).join('')}
        </div>
        <label class="btn btn-sm btn-outline" style="cursor:pointer;">
          Upload Photos
          <input type="file" accept="image/*" multiple style="display:none;" onchange="uploadPhoto(${v.id}, this)">
        </label>
      </td>
      <td><strong>${v.year} ${v.make} ${v.model}</strong></td>
      <td>
        <div style="display:flex;align-items:center;gap:4px;">
          <span>$</span>
          <input type="number" value="${v.weekly_rate}" style="width:80px;padding:6px 8px;border:1.5px solid #e0e0e0;border-radius:4px;"
            onkeydown="if(event.key==='Enter') this.blur();"
            onblur="updateRate(${v.id}, this.value, this)">
          <span>/wk</span>
        </div>
      </td>
      <td>
        <select onchange="updateStatus(${v.id}, this.value)" style="padding:6px 10px;border:1.5px solid #e0e0e0;border-radius:4px;">
          <option value="available" ${v.status === 'available' ? 'selected' : ''}>Available</option>
          <option value="reserved" ${v.status === 'reserved' ? 'selected' : ''}>Reserved</option>
          <option value="rented" ${v.status === 'rented' ? 'selected' : ''}>Rented</option>
          <option value="maintenance" ${v.status === 'maintenance' ? 'selected' : ''}>Maintenance</option>
        </select>
      </td>
      <td>${v.notes || '—'}</td>
      <td><button class="btn btn-sm btn-outline" onclick="removeVehicle(${v.id})">Remove</button></td>
    </tr>
  `).join('') : '<tr><td colspan="6" style="text-align:center;color:#888;padding:32px;">No vehicles yet.</td></tr>';
}

async function uploadPhoto(id, input) {
  const files = input.files;
  if (!files.length) return;
  const formData = new FormData();
  Array.from(files).forEach(f => formData.append('photos', f));
  const res = await fetch(`/api/vehicles/${id}/photo`, { method: 'POST', body: formData });
  if (!res.ok) { alert('Photo upload failed'); return; }
  load();
}

async function removePhoto(vehicleId, photoId) {
  if (!confirm('Remove this photo?')) return;
  await api(`/api/vehicles/${vehicleId}/photo/${photoId}`, { method: 'DELETE' });
  load();
}

async function addVehicle() {
  const make = document.getElementById('new-make').value;
  const model = document.getElementById('new-model').value;
  const year = document.getElementById('new-year').value;
  const weekly_rate = document.getElementById('new-rate').value;
  if (!make || !model || !year || !weekly_rate) { alert('Fill in all fields'); return; }
  await api('/api/vehicles', { method: 'POST', body: JSON.stringify({ make, model, year, weekly_rate }) });
  document.getElementById('new-make').value = '';
  document.getElementById('new-model').value = '';
  document.getElementById('new-year').value = '';
  document.getElementById('new-rate').value = '';
  load();
}

async function updateRate(id, weekly_rate, input) {
  const v = vehicles.find(x => x.id === id);
  if (!weekly_rate || isNaN(weekly_rate) || Number(weekly_rate) <= 0) { alert('Enter a valid weekly rate'); input.value = v.weekly_rate; return; }
  if (Number(weekly_rate) === Number(v.weekly_rate)) return;
  await api(`/api/vehicles/${id}`, { method: 'PATCH', body: JSON.stringify({ weekly_rate: Number(weekly_rate) }) });
  load();
}

async function updateStatus(id, status) {
  await api(`/api/vehicles/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
  load();
}

async function removeVehicle(id) {
  if (!confirm('Remove this vehicle from the fleet?')) return;
  await api(`/api/vehicles/${id}`, { method: 'DELETE' });
  load();
}

(async () => {
  renderSidebar('fleet');
  await requireLogin();
  load();
})();
</script>
</body>
</html>
