<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance — DriveNow Portal</title>
<link rel="stylesheet" href="css/admin.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="admin-layout">
<div id="sidebar-root"></div>
<div class="main-content">
<div class="page">
  <div class="page-title" id="ins-title">Insurance</div>
  <div class="page-sub" id="ins-sub"></div>

  <div class="panel" style="padding:0;overflow-x:auto;">
    <div style="padding:18px 22px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;">
      <div style="display:flex;gap:14px;align-items:center;flex:1;min-width:220px;">
        <select id="ins-mode" style="font-family:inherit;font-weight:700;font-size:0.95rem;border:1.5px solid var(--gray-border);border-radius:4px;padding:9px 10px;background:#fff;">
          <option value="renting">Currently Renting</option>
          <option value="all">All Renters</option>
        </select>
        <input id="ins-search" placeholder="Search by customer name or email…" style="flex:1;min-width:220px;padding:10px 14px;border:1.5px solid var(--gray-border);border-radius:4px;font-family:inherit;font-size:0.9rem;">
      </div>
      <button class="btn" id="ins-add-btn">Add Insurance Record</button>
    </div>
    <table style="margin-top:14px;">
      <thead>
        <tr><th>Customer</th><th>Carrier</th><th>Protection Type</th><th>Status</th><th>Last Verified</th><th>Next Payment Date</th><th>Additional Notes</th></tr>
      </thead>
      <tbody id="ins-table-body"></tbody>
    </table>
  </div>
</div>
</div>
</div>

<div id="add-insurance-overlay" class="simple-modal-overlay" style="display:none;">
  <div class="simple-modal">
    <div class="simple-modal__header">
      <div class="simple-modal__title" id="ai-modal-title">Add Insurance Record</div>
      <button class="simple-modal__close" id="add-insurance-close">&times;</button>
    </div>
    <div class="simple-modal__body">
      <div class="field"><label>Customer</label>
        <select id="ai-customer"><option value="">Select a customer…</option></select>
      </div>
      <div class="field"><label>Carrier</label><input id="ai-carrier" placeholder="e.g. Progressive, GEICO…"></div>
      <div class="field"><label>Protection Type</label><input id="ai-protection-type" placeholder="e.g. Full Coverage, Liability Only…"></div>
      <div class="field"><label>Policy Number</label><input id="ai-policy-number"></div>
      <div class="field"><label>Status</label>
        <select id="ai-status">
          <option value="Active">Active</option>
          <option value="Pending Cancellation">Pending Cancellation</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Last Date Verified</label><input type="date" id="ai-last-verified"></div>
        <div class="field"><label>Next Payment Date</label><input type="date" id="ai-next-payment"></div>
      </div>
      <button class="btn btn-block" id="ai-submit">Save Record</button>
    </div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script>
const TYPE_LABELS = { our_policy: 'Our Policies', private: 'Private' };
const STATUS_BADGE = { Active: 'badge-available', 'Pending Cancellation': 'badge-reserved', Inactive: 'badge-rejected' };
const TYPE_SUBS = {
  our_policy: 'Insurance policies DriveNow carries on behalf of customers.',
  private: "Customers' own personal insurance policies on file.",
};
let section = new URLSearchParams(window.location.search).get('section') === 'private' ? 'private' : 'our_policy';
let records = [];
let customers = [];
let filterMode = 'renting';

function fmtDateOnly(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function render() {
  document.getElementById('ins-title').textContent = `Insurance — ${TYPE_LABELS[section]}`;
  document.getElementById('ins-sub').textContent = TYPE_SUBS[section];

  const search = document.getElementById('ins-search').value.trim().toLowerCase();
  const filtered = records.filter(r => {
    if (filterMode === 'renting' && !r.currently_renting) return false;
    if (!search) return true;
    const haystack = `${r.first_name} ${r.last_name} ${r.email} ${r.carrier || ''}`.toLowerCase();
    return haystack.includes(search);
  });

  document.getElementById('ins-table-body').innerHTML = filtered.length ? filtered.map(r => `
    <tr class="ins-row" data-id="${r.id}" style="cursor:pointer;">
      <td><a href="customer-detail.html?email=${encodeURIComponent(r.email)}" class="ins-cust-link" data-id="${r.id}">${r.first_name} ${r.last_name}</a></td>
      <td>${r.carrier || '—'}</td>
      <td>${r.protection_type || '—'}</td>
      <td><span class="badge ${STATUS_BADGE[r.status] || 'badge-available'}">${r.status || 'Active'}</span></td>
      <td>${fmtDateOnly(r.last_verified_at)}</td>
      <td>${fmtDateOnly(r.next_payment_date)}</td>
      <td>${r.notes || '—'}</td>
    </tr>
  `).join('') : `<tr><td colspan="7" style="text-align:center;color:#888;padding:32px;">No ${filterMode === 'renting' ? 'currently renting ' : ''}${TYPE_LABELS[section].toLowerCase()} insurance records${filterMode === 'renting' ? '' : ' yet'}.</td></tr>`;

  document.querySelectorAll('.ins-row').forEach(tr => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('.ins-cust-link')) return; // let the name link navigate to the customer profile instead
      window.location.href = `insurance-detail.html?id=${tr.dataset.id}`;
    });
  });
}

async function load() {
  [records, customers] = await Promise.all([
    api(`/api/insurance?type=${section}`),
    api('/api/customers'),
  ]);
  document.getElementById('ai-customer').innerHTML = '<option value="">Select a customer…</option>' +
    customers.map(c => `<option value="${c.id}">${c.first_name} ${c.last_name} — ${c.email}</option>`).join('');
  render();
}

document.getElementById('ins-search').addEventListener('input', render);

document.getElementById('ins-mode').addEventListener('change', (e) => {
  filterMode = e.target.value;
  render();
});

document.getElementById('ins-add-btn').addEventListener('click', () => {
  document.getElementById('ai-modal-title').textContent = `Add ${TYPE_LABELS[section]} Insurance Record`;
  document.getElementById('ai-customer').value = '';
  document.getElementById('ai-carrier').value = '';
  document.getElementById('ai-protection-type').value = '';
  document.getElementById('ai-policy-number').value = '';
  document.getElementById('ai-status').value = 'Active';
  document.getElementById('ai-last-verified').value = '';
  document.getElementById('ai-next-payment').value = '';
  document.getElementById('add-insurance-overlay').style.display = 'flex';
});
document.getElementById('add-insurance-close').addEventListener('click', () => {
  document.getElementById('add-insurance-overlay').style.display = 'none';
});
document.getElementById('add-insurance-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'add-insurance-overlay') e.target.style.display = 'none';
});
document.getElementById('ai-submit').addEventListener('click', async () => {
  const customer_id = document.getElementById('ai-customer').value;
  if (!customer_id) { alert('Select a customer'); return; }
  await api('/api/insurance', {
    method: 'POST',
    body: JSON.stringify({
      customer_id,
      type: section,
      carrier: document.getElementById('ai-carrier').value,
      protection_type: document.getElementById('ai-protection-type').value,
      policy_number: document.getElementById('ai-policy-number').value,
      status: document.getElementById('ai-status').value,
      last_verified_at: document.getElementById('ai-last-verified').value,
      next_payment_date: document.getElementById('ai-next-payment').value,
    }),
  });
  document.getElementById('add-insurance-overlay').style.display = 'none';
  await load();
});

(async () => {
  renderSidebar(section === 'private' ? 'insurance-private' : 'insurance-our-policies');
  await requireLogin();
  load();
})();
</script>
</body>
</html>
