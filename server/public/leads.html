<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — DriveNow Portal</title>
<link rel="stylesheet" href="css/admin.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="admin-layout">
<div id="sidebar-root"></div>
<div class="main-content">
<div class="page">
  <div class="page-title">Leads</div>
  <div class="page-sub">Live overview of your pipeline, revenue, and activity. <a href="pipeline.html" style="text-decoration:underline;">View full applications list →</a></div>

  <div class="cards-row" id="stat-cards">
    <div class="stat-card"><div class="stat-card__label">Total Applications</div><div class="stat-card__value" id="stat-total">—</div></div>
    <div class="stat-card"><div class="stat-card__label">Active in Pipeline</div><div class="stat-card__value" id="stat-active">—</div></div>
    <div class="stat-card"><div class="stat-card__label">Completed Rentals</div><div class="stat-card__value green" id="stat-completed">—</div></div>
    <div class="stat-card"><div class="stat-card__label">Rejected</div><div class="stat-card__value orange" id="stat-rejected">—</div></div>
  </div>

  <div class="panel" style="overflow-x:auto;">
    <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <select id="leads-mode" style="font-family:inherit;font-weight:700;font-size:0.95rem;border:1.5px solid var(--gray-border);border-radius:4px;padding:4px 8px;background:#fff;">
        <option value="new">New Leads</option>
        <option value="former">Former Leads</option>
      </select>
    </div>
    <div id="new-leads-list"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Pipeline Overview</div>
    <div class="pipeline-row" id="pipeline-row"></div>
  </div>

  <div class="cards-row" style="grid-template-columns: repeat(3, 1fr);">
    <div class="stat-card"><div class="stat-card__label">Total Revenue Collected</div><div class="stat-card__value green" id="rev-total">—</div></div>
    <div class="stat-card"><div class="stat-card__label">Pending Invoices</div><div class="stat-card__value orange" id="rev-pending">—</div></div>
    <div class="stat-card"><div class="stat-card__label">Paid This Week</div><div class="stat-card__value green" id="rev-week">—</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">Recent Activity</div>
    <div id="activity-list"></div>
  </div>
</div>
</div>
</div>

<script src="js/admin-common.js"></script>
<script>
const RENTAL_DURATION_LABELS = {
  '1-4wk': '1–4 weeks',
  '1-3mo': '1–3 months',
  '3-6mo': '3–6 months',
  '6mo+': '6+ months',
  'ongoing': 'Ongoing',
};

async function loadLeads() {
  const mode = document.getElementById('leads-mode').value;
  const leads = mode === 'former'
    ? await api('/api/applications?decided=1')
    : await api('/api/applications?stage=1&status=active');

  if (mode === 'former') {
    leads.sort((a, b) => new Date(a.lead_decided_at) - new Date(b.lead_decided_at));
  } else {
    leads.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  }

  if (!leads.length) {
    document.getElementById('new-leads-list').innerHTML =
      `<p style="color:#888;font-size:0.85rem;padding:16px 0;">${mode === 'former' ? 'No former leads.' : 'No new leads right now.'}</p>`;
    return;
  }

  const rows = leads.map(l => {
    const tier = l.vehicle_tier || (l.vehicle_make ? `${l.vehicle_year} ${l.vehicle_make} ${l.vehicle_model}` : '—');
    const duration = RENTAL_DURATION_LABELS[l.rental_duration] || l.rental_duration || '—';
    const insurance = l.has_own_insurance ? `<span style="color:#2e7d32;font-weight:600;">Yes</span>` : `<span style="color:#c62828;font-weight:600;">No</span>`;
    const decisionBadge = mode === 'former'
      ? `<span class="badge ${l.lead_decision === 'approved' ? 'badge-completed' : 'badge-rejected'}" style="margin-left:8px;">${l.lead_decision === 'approved' ? 'Approved' : 'Rejected'}</span>`
      : '';
    const actionBtns = mode === 'new'
      ? `<div style="display:flex;gap:8px;">
           <button class="lead-action-btn lead-approve" data-id="${l.id}" title="Move to Potential Arrivals" style="width:32px;height:32px;border-radius:50%;border:1.5px solid #2e7d32;color:#2e7d32;background:#fff;font-weight:800;cursor:pointer;">✓</button>
           <button class="lead-action-btn lead-reject" data-id="${l.id}" title="Reject" style="width:32px;height:32px;border-radius:50%;border:1.5px solid #c62828;color:#c62828;background:#fff;font-weight:800;cursor:pointer;">✕</button>
         </div>`
      : `<button class="lead-action-btn lead-undo" data-id="${l.id}" title="Send back to New Leads" style="width:32px;height:32px;border-radius:50%;border:1.5px solid #888;color:#555;background:#fff;font-weight:800;cursor:pointer;">↺</button>`;

    return `
      <tr style="border-bottom:1px solid var(--gray-border);">
        <td style="padding:14px 12px;">
          <a href="customer-detail.html?email=${encodeURIComponent(l.email)}" style="font-weight:600;color:var(--black);text-decoration:none;">${l.first_name} ${l.last_name}</a>${decisionBadge}
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">${mode === 'former' ? fmtDate(l.lead_decided_at) : fmtDate(l.created_at)}</div>
        </td>
        <td style="padding:14px 12px;font-size:0.88rem;">${tier}</td>
        <td style="padding:14px 12px;font-size:0.88rem;">${duration}</td>
        <td style="padding:14px 12px;font-size:0.88rem;">${insurance}</td>
        <td style="padding:14px 12px;">${actionBtns}</td>
      </tr>`;
  }).join('');

  document.getElementById('new-leads-list').innerHTML = `
    <table style="width:100%;border-collapse:collapse;">
      <thead>
        <tr style="border-bottom:2px solid var(--gray-border);">
          <th style="padding:10px 12px;text-align:left;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);font-weight:700;">Applicant</th>
          <th style="padding:10px 12px;text-align:left;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);font-weight:700;">Vehicle Tier</th>
          <th style="padding:10px 12px;text-align:left;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);font-weight:700;">Rental Duration</th>
          <th style="padding:10px 12px;text-align:left;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);font-weight:700;">Insurance</th>
          <th style="padding:10px 12px;"></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

  document.querySelectorAll('.lead-approve').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await api(`/api/applications/${btn.dataset.id}/move-to-arrivals`, { method: 'POST' });
        await loadLeads();
      } catch (err) {
        alert(err.message || 'Could not move this lead to arrivals.');
        btn.disabled = false;
      }
    });
  });
  document.querySelectorAll('.lead-reject').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await api(`/api/applications/${btn.dataset.id}/reject-lead`, { method: 'POST' });
      await loadLeads();
    });
  });
  document.querySelectorAll('.lead-undo').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await api(`/api/applications/${btn.dataset.id}/undo-lead-decision`, { method: 'POST' });
      await loadLeads();
    });
  });
}

(async () => {
  renderSidebar('leads');
  await requireLogin();
  const data = await api('/api/dashboard/summary');
  document.getElementById('leads-mode').addEventListener('change', loadLeads);
  await loadLeads();

  document.getElementById('stat-total').textContent = data.counts.totalApplications;
  document.getElementById('stat-active').textContent = data.counts.activeApplications;
  document.getElementById('stat-completed').textContent = data.counts.completedApplications;
  document.getElementById('stat-rejected').textContent = data.counts.rejectedApplications;

  document.getElementById('pipeline-row').innerHTML = data.pipeline.map(p => `
    <div class="pipeline-col">
      <div class="pipeline-col__num">${p.count}</div>
      <div class="pipeline-col__name">${p.stage}. ${p.name}</div>
    </div>
  `).join('');

  document.getElementById('rev-total').textContent = fmtMoney(data.revenue.totalRevenue);
  document.getElementById('rev-pending').textContent = fmtMoney(data.revenue.pendingInvoices);
  document.getElementById('rev-week').textContent = fmtMoney(data.revenue.paidThisWeek);

  document.getElementById('activity-list').innerHTML = data.recentActivity.length
    ? data.recentActivity.map(a => `
        <div class="activity-item">
          <div>${a.first_name ? `<strong>${a.first_name} ${a.last_name}</strong> — ` : ''}${a.message}</div>
          <div class="activity-item__time">${fmtDate(a.created_at)}</div>
        </div>
      `).join('')
    : '<p style="color:#888;font-size:0.85rem;">No activity yet.</p>';
})();
</script>
</body>
</html>
