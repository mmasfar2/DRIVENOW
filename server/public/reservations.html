<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservations — DriveNow Portal</title>
<link rel="stylesheet" href="css/admin.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="admin-layout">
<div id="sidebar-root"></div>
<div class="main-content">
<div class="page">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;">
    <div>
      <div class="page-title">Reservations</div>
      <div class="page-sub" style="margin-bottom:0;">Manage reservation requests and active rentals.</div>
    </div>
    <button class="btn" id="new-resv-btn">+ New Reservation</button>
  </div>
  <div style="height:24px;"></div>

  <div class="cards-row">
    <div class="stat-card">
      <div class="stat-card__top"><div class="stat-card__label">Total Bookings</div><div class="stat-card__icon icon-blue" id="icon-calendar1"></div></div>
      <div class="stat-card__value" id="r-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__top"><div class="stat-card__label">Upcoming</div><div class="stat-card__icon icon-purple" id="icon-calendar2"></div></div>
      <div class="stat-card__value" id="r-upcoming">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__top"><div class="stat-card__label">On Rental</div><div class="stat-card__icon icon-green" id="icon-car1"></div></div>
      <div class="stat-card__value green" id="r-rental">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__top"><div class="stat-card__label">Outstanding Balance</div><div class="stat-card__icon icon-orange" id="icon-card1"></div></div>
      <div class="stat-card__value orange" id="r-balance">—</div>
    </div>
  </div>

  <div class="panel" style="padding:0;">
    <div style="display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--gray-border);overflow-x:auto;">
      <button class="resv-tab active" data-bucket="all">All Bookings</button>
      <button class="resv-tab" data-bucket="upcoming">Upcoming</button>
      <button class="resv-tab" data-bucket="on_rental">On Rental</button>
      <button class="resv-tab" data-bucket="pending_payment">Pending Payment</button>
      <button class="resv-tab" data-bucket="completed">Completed</button>
    </div>
    <div style="display:flex;gap:12px;padding:18px 20px;flex-wrap:wrap;">
      <input id="r-search" placeholder="Search by name, email, phone, or car..." style="flex:1;min-width:220px;padding:10px 14px;border:1.5px solid var(--gray-border);border-radius:4px;font-family:inherit;">
      <span id="r-count" style="align-self:center;color:var(--text-muted);font-size:0.85rem;white-space:nowrap;"></span>
    </div>
    <div id="r-list" style="padding:0 20px 20px;"></div>
  </div>
</div>
</div>
</div>

<div id="resv-modal-overlay" class="resv-modal-overlay" style="display:none;">
  <div class="resv-modal">
    <div class="resv-modal__header">
      <div class="resv-modal__title">New Reservation</div>
      <button class="resv-modal__close" id="resv-modal-close">&times;</button>
    </div>
    <div class="resv-steps">
      <div class="resv-step-dot active" data-step="1"><span>1</span>Dates</div>
      <div class="resv-step-dot" data-step="2"><span>2</span>Vehicle</div>
      <div class="resv-step-dot" data-step="3"><span>3</span>Customer</div>
      <div class="resv-step-dot" data-step="4"><span>4</span>Review</div>
    </div>
    <div class="resv-modal__body" id="resv-modal-body"></div>
    <div class="resv-modal__footer">
      <button class="btn btn-outline btn-sm" id="resv-back-btn">Back</button>
      <span class="error-msg" id="resv-error" style="margin:0;display:none;flex:1;"></span>
      <button class="btn btn-sm" id="resv-next-btn">Next</button>
    </div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<style>
.resv-tab { padding: 14px 16px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.resv-tab:hover { color: var(--black); }
.resv-tab.active { color: var(--black); border-bottom-color: var(--black); }
.resv-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--gray-border); gap: 16px; flex-wrap: wrap; }
.resv-row:last-child { border-bottom: none; }
.resv-row__name { font-weight: 700; font-size: 0.92rem; }
.resv-row__sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
.resv-row__right { display: flex; align-items: center; gap: 16px; }

.resv-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex;
  align-items: center; justify-content: center; z-index: 100;
}
.resv-modal {
  background: #fff; border-radius: 10px; width: 520px; max-width: 92vw;
  max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
}
.resv-modal__header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--gray-border); }
.resv-modal__title { font-weight: 800; font-size: 1.05rem; }
.resv-modal__close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); line-height: 1; }
.resv-steps { display: flex; padding: 16px 22px 0; gap: 8px; }
.resv-step-dot {
  flex: 1; text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--text-muted);
  padding-bottom: 12px; border-bottom: 3px solid var(--gray-border); display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.resv-step-dot span {
  width: 22px; height: 22px; border-radius: 50%; background: var(--gray-light); color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; font-size: 0.7rem;
}
.resv-step-dot.active { color: var(--black); border-bottom-color: var(--black); }
.resv-step-dot.active span { background: var(--black); color: #fff; }
.resv-modal__body { padding: 22px; overflow-y: auto; flex: 1; }
.resv-modal__footer { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-top: 1px solid var(--gray-border); }
.resv-vehicle-option {
  display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
  border: 1.5px solid var(--gray-border); border-radius: 6px; margin-bottom: 8px; cursor: pointer;
}
.resv-vehicle-option:hover { border-color: var(--black); }
.resv-vehicle-option.selected { border-color: var(--black); background: var(--gray-light); }
.resv-review-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--gray-border); font-size: 0.88rem; }
.resv-review-row:last-child { border-bottom: none; }
</style>
<script>
let bookings = [];
let activeBucket = 'all';

const bucketLabels = {
  upcoming: { text: 'Upcoming', cls: 'badge-reserved' },
  on_rental: { text: 'On Rental', cls: 'badge-rented' },
  pending_payment: { text: 'Pending Payment', cls: 'badge-rejected' },
  completed: { text: 'Completed', cls: 'badge-completed' },
};

function renderList() {
  const search = document.getElementById('r-search').value.trim().toLowerCase();
  let filtered = bookings.filter(b => activeBucket === 'all' || b.bucket === activeBucket);
  if (search) {
    filtered = filtered.filter(b =>
      `${b.first_name} ${b.last_name}`.toLowerCase().includes(search) ||
      (b.email || '').toLowerCase().includes(search) ||
      (b.phone || '').toLowerCase().includes(search) ||
      `${b.make} ${b.model}`.toLowerCase().includes(search)
    );
  }

  document.getElementById('r-count').textContent = `${filtered.length} reservation${filtered.length === 1 ? '' : 's'}`;

  document.getElementById('r-list').innerHTML = filtered.length
    ? filtered.map(b => {
        const label = bucketLabels[b.bucket];
        return `
          <div class="resv-row">
            <div>
              <div class="resv-row__name">${b.first_name} ${b.last_name}</div>
              <div class="resv-row__sub">${b.year} ${b.make} ${b.model} · ${fmtDate(b.updated_at)}</div>
            </div>
            <div class="resv-row__right">
              <div style="text-align:right;">
                <div style="font-weight:700;">${fmtMoney(b.weekly_rate)}<span style="font-weight:400;color:var(--text-muted);font-size:0.78rem;"> /wk</span></div>
                ${b.bucket === 'pending_payment' ? `<div class="resv-row__sub">Invoiced ${fmtMoney(b.invoice_amount)}</div>` : ''}
              </div>
              <span class="badge ${label.cls}">${label.text}</span>
              <a href="application.html?id=${b.id}" class="btn btn-sm btn-outline">View</a>
            </div>
          </div>
        `;
      }).join('')
    : `<div class="empty-state">${icon('calendar', 36)}<div style="font-size:1rem;font-weight:700;color:var(--black);">No Bookings Found</div><span>No reservations match your current filter. Try changing the filter or check back later.</span></div>`;
}

(async () => {
  renderSidebar('reservations');
  await requireLogin();

  document.getElementById('icon-calendar1').innerHTML = icon('calendar');
  document.getElementById('icon-calendar2').innerHTML = icon('calendar');
  document.getElementById('icon-car1').innerHTML = icon('car');
  document.getElementById('icon-card1').innerHTML = icon('card');

  const data = await api('/api/applications/bookings/all');
  bookings = data.bookings;

  document.getElementById('r-total').textContent = data.stats.totalBookings;
  document.getElementById('r-upcoming').textContent = data.stats.upcoming;
  document.getElementById('r-rental').textContent = data.stats.onRental;
  document.getElementById('r-balance').textContent = fmtMoney(data.stats.outstandingBalance);

  document.querySelectorAll('.resv-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.resv-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeBucket = tab.dataset.bucket;
      renderList();
    });
  });
  document.getElementById('r-search').addEventListener('input', renderList);

  renderList();

  initNewReservationModal();
})();

function initNewReservationModal() {
  const overlay = document.getElementById('resv-modal-overlay');
  const body = document.getElementById('resv-modal-body');
  const backBtn = document.getElementById('resv-back-btn');
  const nextBtn = document.getElementById('resv-next-btn');
  const errorEl = document.getElementById('resv-error');

  let step = 1;
  let vehicles = [];
  const form = {
    pickup_scheduled_at: '', rental_end_at: '',
    assigned_vehicle_id: null, weekly_rate: null, total_due_at_pickup: '',
    first_name: '', last_name: '', phone: '', email: '',
  };

  function todayStr(offsetDays = 0) {
    const d = new Date();
    d.setDate(d.getDate() + offsetDays);
    return d.toISOString().slice(0, 10);
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = msg ? 'block' : 'none';
  }

  function setStepDots() {
    document.querySelectorAll('.resv-step-dot').forEach(dot => {
      dot.classList.toggle('active', Number(dot.dataset.step) === step);
    });
    backBtn.style.visibility = step === 1 ? 'hidden' : 'visible';
    nextBtn.textContent = step === 4 ? 'Create Reservation' : 'Next';
  }

  function renderStep() {
    showError('');
    setStepDots();
    if (step === 1) {
      const minPickup = todayStr(0);
      const maxPickup = todayStr(3);
      const minReturn = form.pickup_scheduled_at ? new Date(new Date(form.pickup_scheduled_at).getTime() + 7 * 86400000).toISOString().slice(0, 10) : '';
      body.innerHTML = `
        <div class="field">
          <label>Pickup Date</label>
          <input type="date" id="f-pickup" min="${minPickup}" max="${maxPickup}" value="${form.pickup_scheduled_at}">
        </div>
        <div class="field">
          <label>Return Date</label>
          <input type="date" id="f-return" min="${minReturn || minPickup}" value="${form.rental_end_at}" ${form.pickup_scheduled_at ? '' : 'disabled'}>
        </div>
        <div style="font-size:0.78rem;color:var(--text-muted);">Pickup must be within 3 days of today. Minimum rental length is one week.</div>
      `;
      document.getElementById('f-pickup').addEventListener('change', (e) => {
        form.pickup_scheduled_at = e.target.value;
        form.rental_end_at = '';
        renderStep();
      });
      document.getElementById('f-return').addEventListener('change', (e) => { form.rental_end_at = e.target.value; });
    } else if (step === 2) {
      body.innerHTML = vehicles.length
        ? vehicles.map(v => `
            <div class="resv-vehicle-option ${form.assigned_vehicle_id === v.id ? 'selected' : ''}" data-id="${v.id}">
              <div>
                <div style="font-weight:700;">${v.year} ${v.make} ${v.model}</div>
                <div style="font-size:0.78rem;color:var(--text-muted);">${v.status}</div>
              </div>
              <div style="font-weight:700;">${fmtMoney(v.weekly_rate)}<span style="font-weight:400;color:var(--text-muted);font-size:0.78rem;"> /wk</span></div>
            </div>
          `).join('')
        : `<div class="empty-state"><span>No available vehicles</span></div>`;
      body.querySelectorAll('.resv-vehicle-option').forEach(el => {
        el.addEventListener('click', () => {
          const v = vehicles.find(x => x.id === Number(el.dataset.id));
          form.assigned_vehicle_id = v.id;
          form.weekly_rate = v.weekly_rate;
          renderStep();
        });
      });
    } else if (step === 3) {
      body.innerHTML = `
        <div class="field"><label>First Name</label><input id="f-first" value="${form.first_name}"></div>
        <div class="field"><label>Last Name</label><input id="f-last" value="${form.last_name}"></div>
        <div class="field"><label>Phone</label><input id="f-phone" value="${form.phone}"></div>
        <div class="field"><label>Email</label><input id="f-email" value="${form.email}"></div>
        <div class="field"><label>Total Due at Pickup (optional)</label><input id="f-total" type="number" value="${form.total_due_at_pickup}"></div>
      `;
      ['first', 'last', 'phone', 'email', 'total'].forEach(key => {
        document.getElementById(`f-${key}`).addEventListener('input', (e) => {
          const map = { first: 'first_name', last: 'last_name', phone: 'phone', email: 'email', total: 'total_due_at_pickup' };
          form[map[key]] = e.target.value;
        });
      });
    } else if (step === 4) {
      const v = vehicles.find(x => x.id === form.assigned_vehicle_id);
      body.innerHTML = `
        <div class="resv-review-row"><span>Customer</span><span>${form.first_name} ${form.last_name}</span></div>
        <div class="resv-review-row"><span>Contact</span><span>${form.phone} · ${form.email}</span></div>
        <div class="resv-review-row"><span>Vehicle</span><span>${v ? `${v.year} ${v.make} ${v.model}` : '—'}</span></div>
        <div class="resv-review-row"><span>Pickup</span><span>${form.pickup_scheduled_at}</span></div>
        <div class="resv-review-row"><span>Return</span><span>${form.rental_end_at}</span></div>
        <div class="resv-review-row"><span>Weekly Rate</span><span>${fmtMoney(form.weekly_rate)}</span></div>
        <div class="resv-review-row"><span>Due at Pickup</span><span>${form.total_due_at_pickup ? fmtMoney(form.total_due_at_pickup) : '—'}</span></div>
      `;
    }
  }

  function validateStep() {
    if (step === 1) {
      if (!form.pickup_scheduled_at) return 'Select a pickup date';
      if (!form.rental_end_at) return 'Select a return date';
      const minReturn = new Date(new Date(form.pickup_scheduled_at).getTime() + 7 * 86400000);
      if (new Date(form.rental_end_at) < minReturn) return 'Rental must be at least one week';
    } else if (step === 2) {
      if (!form.assigned_vehicle_id) return 'Select a vehicle';
    } else if (step === 3) {
      if (!form.first_name || !form.last_name || !form.phone || !form.email) return 'All customer fields are required';
    }
    return null;
  }

  async function openModal() {
    step = 1;
    Object.assign(form, {
      pickup_scheduled_at: '', rental_end_at: '', assigned_vehicle_id: null, weekly_rate: null,
      total_due_at_pickup: '', first_name: '', last_name: '', phone: '', email: '',
    });
    overlay.style.display = 'flex';
    try {
      vehicles = await api('/api/vehicles');
      vehicles = vehicles.filter(v => v.status === 'available');
    } catch { vehicles = []; }
    renderStep();
  }

  document.getElementById('new-resv-btn').addEventListener('click', openModal);
  document.getElementById('resv-modal-close').addEventListener('click', () => { overlay.style.display = 'none'; });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.style.display = 'none'; });

  backBtn.addEventListener('click', () => { if (step > 1) { step--; renderStep(); } });

  nextBtn.addEventListener('click', async () => {
    const err = validateStep();
    if (err) { showError(err); return; }
    if (step < 4) { step++; renderStep(); return; }

    nextBtn.disabled = true;
    try {
      await api('/api/applications/manual-booking', { method: 'POST', body: JSON.stringify(form) });
      overlay.style.display = 'none';
      const data = await api('/api/applications/bookings/all');
      bookings = data.bookings;
      document.getElementById('r-total').textContent = data.stats.totalBookings;
      document.getElementById('r-upcoming').textContent = data.stats.upcoming;
      document.getElementById('r-rental').textContent = data.stats.onRental;
      document.getElementById('r-balance').textContent = fmtMoney(data.stats.outstandingBalance);
      renderList();
    } catch (e) {
      showError(e.message);
    }
    nextBtn.disabled = false;
  });
}
</script>
</body>
</html>
